# Version updates (weekly). Security updates are separate: they open a PR as soon as an advisory
# with a patched version appears (repo setting "Dependabot security updates").
version: 2
# xindeler-auth is a private git dependency: Dependabot needs a read-only token to resolve it
# (secret DEPENDABOT_GIT_TOKEN, fine-grained PAT with Contents: read on xindeler-auth only).
registries:
  xindeler-auth-git:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GIT_TOKEN}}
updates:
  # Rust: only Cargo.lock moves (Cargo.toml requirements are left alone), all minor/patch bumps in one PR.
  - package-ecosystem: cargo
    directory: /
    registries:
      - xindeler-auth-git
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
