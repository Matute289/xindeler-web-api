[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# xindeler-auth-common (see server/Cargo.toml) — private repo, read-only
# deploy key in CI. Explicitly allowlisted rather than disabling
# unknown-git wholesale, so any *other* git dependency still fails closed.
allow-git = ["ssh://git@github.com/Matute289/xindeler-auth.git"]
