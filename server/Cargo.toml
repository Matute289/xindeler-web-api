[package]
name = "xindeler-web-api-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
xindeler-web-api-common = { path = "../common" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.60"
percent-encoding = "2"
hex = "0.4"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite"] }
chrono = { version = "0.4.31", default-features = false, features = ["std", "clock"] }
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
sha2 = "0.11"
ipnet = "2"
csv = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1.0.60"
rand = "0.10"
