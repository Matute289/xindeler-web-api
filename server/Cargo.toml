[package]
name = "xindeler-web-api-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
xindeler-web-api-common = { path = "../common" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.60"
percent-encoding = "2"
hex = "0.4"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite"] }
chrono = { version = "0.4.31", default-features = false, features = ["std", "clock"] }
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
sha2 = "0.11"
ipnet = "2"
csv = "1"
uuid = { version = "1", default-features = false, features = ["serde", "v4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# Wire types only — never `xindeler-authc`, whose sign_in()/register()
# helpers call net_prehash() internally on whatever they're given. This
# service always receives an already-prehashed password from the frontend
# and must never hash it a second time, so the payload structs are built by
# hand against these types instead (see server/src/authclient.rs).
#
# Pin bumped deliberately when xindeler-auth ships something this repo
# needs — same convention xindeler-new-horizon and xindeler-zuul use for
# the same dependency.
xindeler-auth-common = { package = "xindeler-auth-common", git = "ssh://git@github.com/Matute289/xindeler-auth.git", rev = "c40c3eb5f88b14515fde251433586f2e63ce071f" }

[dev-dependencies]
serde_json = "1.0.60"
rand = "0.10"
